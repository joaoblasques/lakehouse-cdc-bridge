# Local stand-ins for the cloud services. Nothing here touches Azure or Confluent Cloud.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-LocalDev!Passw0rd}"
      MSSQL_AGENT_ENABLED: "true"  # SQL Server Agent runs the CDC capture job
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 30

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      CLUSTER_ID: "bWNkY2RjX2JhbmtpbmdfMQ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are provisioned by ensure_topics
      KAFKA_NUM_PARTITIONS: 3
    ports: ["9092:9092"]

  # DB2 plays the mainframe core-banking system. Heavy (4 GB image, minutes to initialise),
  # so it only starts with: docker compose --profile db2 up -d
  db2:
    image: ibmcom/db2:11.5.8.0
    profiles: [db2]
    privileged: true  # required by the Db2 Community image
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: "${DB2_PASSWORD:-LocalDev!Passw0rd}"
      DBNAME: COREBANK
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    ports: ["50000:50000"]
