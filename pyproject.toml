[project]
name = "banking-cdc"
version = "0.1.0"
description = "CDC from heterogeneous banking sources into Kafka (Confluent) and Delta Lake, built for Databricks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "pymssql>=2.3",
    "azure-storage-file-share>=12.17",
    "pyyaml>=6.0",
    "faker>=26.0",
]

[project.optional-dependencies]
spark = ["pyspark==4.0.1", "delta-spark==4.0.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_cdc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs docker compose services (SQL Server, Kafka)",
    "spark: needs a local Spark + Delta session",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
