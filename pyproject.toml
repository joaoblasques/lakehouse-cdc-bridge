[project]
name = "lakehouse-cdc-bridge"
version = "0.1.0"
description = "CDC from heterogeneous banking sources into Kafka (Confluent) and Delta Lake, built for Databricks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "pymssql>=2.3",
    "ibm-db>=3.2",
    "azure-storage-file-share>=12.17",
    "pyyaml>=6.0",
    "faker>=26.0",
]

[project.optional-dependencies]
spark = ["pyspark==4.0.1", "delta-spark==4.0.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_cdc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs docker compose services (SQL Server, Kafka)",
    "spark: needs a local Spark + Delta session",
    "db2: needs `docker compose --profile db2 up -d` (Db2 Community, slow to start)",
    "kafka: needs the local Kafka from `docker compose up -d`",
]
addopts = "-m 'not integration and not db2 and not kafka'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: spark/dbutils/display and names from `%run ./_common` are runtime globals.
"notebooks/*" = ["F821"]
